services:
  wa-bot:
    build:
      context: .
      dockerfile: Dockerfile.rust
    container_name: wa-bot
    restart: always
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/whatsapp.db
      - RUST_LOG=info
      - CACHE_MAX=500
      - CACHE_TTL_DAYS=7
      # Tanpa nilai di host = tidak dikirim (QR code). Isi untuk pairing code.
      - PAIR_PHONE
      # Kosong/tidak diset = notifikasi ke akun bot sendiri.
      - TARGET_JID
    volumes:
      - wa-data:/data

volumes:
  wa-data:
